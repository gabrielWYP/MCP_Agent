schema: spec-driven

context: |
  Tech stack: Python 3.14 (system) / 3.12 (venv), LangGraph + LangChain orchestrator, PyTorch 2.1+ (ConvNeXtV2 Teacher), FastAPI serving
  Architecture: Graph-based agent (LangGraph StateGraph), pipeline pattern, multimodal DL (RGB+NIR, cross-modal fusion, YOLO detection head, knowledge distillation), OCI cloud storage
  Testing: pytest available. Single test file (src/models/master/test_arch.py) — script-style assertions, not pytest functions. No CI/CD yet (Phase 2).
  Style: pip+requirements.txt. No pyproject.toml. No linter/formatter/type checker configured yet (Phase 3 — ruff, mypy, ruff format).

testing:
  strict_tdd: false
  reason: "Standard mode. Full pytest suite (93+ tests) passes via ./.venv/bin/python -m pytest; `python` is not on PATH, use the venv interpreter."
  test_runner:
    command: "./.venv/bin/python -m pytest"
    framework: pytest (93+ tests passing as of damage-map-audit, ~80s)
  layers:
    unit:
      available: true
      tool: "pytest"
      scope: "tests/ (93+ pytest-collected tests across src/training, src/models, scripts/)"
      count: 93
      note: "Full pytest-collected suite; run via ./.venv/bin/python -m pytest (`python` is not on PATH)."
      coverage: "Not measured; no coverage threshold configured yet."
    integration:
      available: false
      tool: "—"
      planned: "Phase 2"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: false
    command: "—"
    threshold: "N/A (not configured yet)"
  quality:
    linter:
      available: false
      command: "—"
      planned: "Phase 3 (ruff)"
    type_checker:
      available: false
      command: "—"
      planned: "Phase 3 (mypy)"
    formatter:
      available: false
      command: "—"
      planned: "Phase 3 (ruff format)"

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - All new AI/ML pipelines require an evaluation protocol
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (src/package modular structure)
    - New modules go under src/<domain>/
    tdd: false
    test_command: "./.venv/bin/python -m pytest"
  verify:
    test_command: "./.venv/bin/python -m pytest"
    build_command: "./.venv/bin/python -c \"import src.training.train, src.training.kd_train\""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
